    <!-- Modale JSROOT -->
    <div id="modal-viewer">
        <div id="modal-box">
            <div id="modal-header">
                <span id="modal-title" style="font-weight:600; color:#334155;">Plot Interattivo</span>
                <button id="modal-close" onclick="closeViewer()">&times;</button>
            </div>
            <div id="jsroot-container"></div>
        </div>
    </div>

    <script>
        function openInteractive(rootFileName) {
            const modal = document.getElementById("modal-viewer");
            const container = document.getElementById("jsroot-container");
            document.getElementById("modal-title").innerText = rootFileName;
            modal.style.display = "flex";
            container.innerHTML = "<p style='padding:20px;'>Caricamento canvas in corso...</p>";

            // JSROOT apre il file relativo al path corrente
            JSROOT.openFile(rootFileName)
                .then(file => {
                    // Prende il primo oggetto (la TCanvas) e lo disegna
                    return file.readObject(file.fKeys[0].fName);
                })
                .then(obj => {
                    container.innerHTML = "";
                    JSROOT.draw("jsroot-container", obj, "");
                })
                .catch(err => {
                    container.innerHTML = "<p style='color:red; padding:20px;'>Errore nel caricamento del file ROOT: " + err + "</p>";
                });
        }

        function closeViewer() {
            document.getElementById("modal-viewer").style.display = "none";
            document.getElementById("jsroot-container").innerHTML = "";
        }

        // Chiude la finestra se si preme ESC o clicca fuori
        window.onclick = function(e) {
            if (e.target == document.getElementById("modal-viewer")) closeViewer();
        };
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") closeViewer();
        });
    </script>
